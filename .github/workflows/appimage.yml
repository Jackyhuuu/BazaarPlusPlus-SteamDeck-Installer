name: AppImage
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux GUI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxkbcommon-x11-0 libopengl0 zsync desktop-file-utils squashfs-tools fonts-noto-cjk xvfb xauth
      - name: Build and validate AppImage
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BazaarPlusPlus-SteamDeck-x86_64
          path: |
            dist/BazaarPlusPlus-SteamDeck-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BazaarPlusPlus-SteamDeck-x86_64
          path: release
      - name: Publish prerelease for Steam Deck validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-preview.{0}', github.run_number) }}
          REVISION: ${{ github.sha }}
        run: gh release create "$TAG" release/* --target "$REVISION" --prerelease --title "$TAG · Steam Deck preview" --notes 'Native Linux installer. Automated startup checks passed; Steam Deck hardware compatibility still needs validation. Download the AppImage asset, enable execution, and open it in Desktop Mode.'
